<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <!-- Aplica o tema salvo antes do React carregar, para a página não piscar no tema padrão. -->
  <script>
    try {
      var theme = window.localStorage.getItem("portfolio.theme");
      if (theme === "cianotipo" || theme === "prancheta" || theme === "anil") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    } catch (error) {}
  </script>
</head>
<body>
  <!-- Ponto de montagem da aplicação React. -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
